<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Missão Doomsday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070b08" media="(prefers-color-scheme: dark)">
<style>
/* Layout: uma coluna mobile (máx 560px), header sticky, tab bar fixa em baixo.
   Estrutura do DESIGN.md da Nike (ink/branco/cinza, pills, sem sombras, display uppercase gigante)
   com o verde Doomsday como único acento. */
:root{
  --bg:#ffffff; --surface:#f5f5f5; --ink:#111111; --ink-2:#39393b; --mute:#707072;
  --line:#e5e5e5; --line-strong:#cacacb;
  --red:#12803a; --red-text:#0d6b2f; --on-red:#ffffff; --red-soft:#e9f5ec;
  --tile:#0b140e; --on-tile:#f2f7f3; --tile-mute:#93a898; --glow:#3ee06b;
  --ok:#0d6b2f;
  --f-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --s-xs:4px; --s-sm:8px; --s-md:12px; --s-lg:18px; --s-xl:24px; --s-xxl:30px; --s-sec:48px;
  --r-pill:9999px; --r-md:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#070b08; --surface:#111813; --ink:#f2f6f3; --ink-2:#c6d0c8; --mute:#8f9a92;
  --line:#1c271f; --line-strong:#2e3d32;
  --red:#36d363; --red-text:#5be884; --on-red:#04110a; --red-soft:#0f2316;
  --tile:#0d1a11; --on-tile:#eef6f0; --tile-mute:#8fa596; --glow:#3ee06b; --ok:#5be884; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#070b08; --surface:#111813; --ink:#f2f6f3; --ink-2:#c6d0c8; --mute:#8f9a92;
  --line:#1c271f; --line-strong:#2e3d32;
  --red:#36d363; --red-text:#5be884; --on-red:#04110a; --red-soft:#0f2316;
  --tile:#0d1a11; --on-tile:#eef6f0; --tile-mute:#8fa596; --glow:#3ee06b; --ok:#5be884; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:var(--s-md);padding-block:var(--s-md)}
.brand{display:flex;align-items:center;gap:var(--s-sm);min-width:0}
.mark{background:var(--red);color:var(--on-red);font-family:var(--f-display);font-size:15px;line-height:1;padding:6px 7px 5px;letter-spacing:.02em;text-transform:uppercase}
.brand-name{font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.count{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.count b{color:var(--red-text);font-weight:700}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:var(--s-xxl);padding-block:var(--s-xl)}

/* progress segments */
.segs{display:grid;grid-template-columns:repeat(23,1fr);gap:3px}
.segs i{display:block;height:6px;background:var(--line)}
.segs i.on{background:var(--red)}
.segs i.now{background:var(--ink)}
.prog-meta{display:flex;justify-content:space-between;gap:var(--s-md);margin-top:var(--s-sm);font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}

/* eyebrow labels */
.eyebrow{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.eyebrow.red{color:var(--red-text)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-md)}
.sec-title{font-family:var(--f-display);font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.01em}

/* hero tile (campaign tile) */
.hero{background:var(--tile);color:var(--on-tile);padding:var(--s-xl) var(--s-lg) var(--s-lg);display:flex;flex-direction:column;gap:var(--s-lg);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 100% 0%,color-mix(in srgb,var(--glow) 28%,transparent),transparent 60%);pointer-events:none}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:22px solid var(--glow);border-radius:50%;opacity:.85;pointer-events:none;box-shadow:0 0 40px color-mix(in srgb,var(--glow) 45%,transparent)}
.hero > *{position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s-md);position:relative;z-index:1}
.hero-num{font-family:var(--f-display);font-size:64px;line-height:.85;color:var(--glow);position:relative}
.hero-num small{display:block;font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.1em;color:var(--tile-mute);margin-top:6px;text-transform:uppercase}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:var(--r-pill);border:1px solid currentColor;white-space:nowrap}
.hero .tag{color:var(--on-tile)}
.hero-title{font-family:var(--f-display);font-size:clamp(44px,13vw,68px);line-height:.92;text-transform:uppercase;letter-spacing:.005em;position:relative;z-index:1}
.hero-sub{font-family:var(--f-label);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--tile-mute);margin-top:6px}
.hero-log{color:var(--on-tile);opacity:.86;max-width:44ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:var(--s-sm)}

/* buttons: pill only */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border-radius:var(--r-pill);border:0;cursor:pointer;font-weight:600;font-size:16px;line-height:1.2;text-decoration:none;transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:var(--on-red)}
.btn-red:hover{opacity:.92}
.btn-soft{background:var(--surface);color:var(--ink)}
.btn-soft:hover{background:var(--line)}
.btn-ghost-tile{background:transparent;color:var(--on-tile);box-shadow:inset 0 0 0 1.5px var(--tile-mute)}
.btn-sm{min-height:40px;padding:8px 18px;font-size:15px}

/* doomsday strip */
.doom{display:flex;align-items:center;justify-content:space-between;gap:var(--s-md);padding:var(--s-md) var(--s-lg);background:var(--surface)}
.doom-days{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--red-text);font-variant-numeric:tabular-nums}
.doom-txt{min-width:0}
.doom-txt b{display:block;font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:16px}
.doom-txt span{color:var(--mute);font-size:14px}

/* note card */
.notes{display:flex;flex-direction:column;gap:var(--s-md)}
.note{border:1px solid var(--line-strong);background:var(--bg)}
.note.read{border-color:var(--line)}
.note-head{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s-md);padding:var(--s-md) var(--s-lg) var(--s-md) var(--s-md);background:none;border:0;text-align:left;cursor:pointer;min-height:64px}
.note-head:hover{background:var(--surface)}
.note-ico{width:36px;height:36px;display:grid;place-items:center;background:var(--red-soft);color:var(--red-text);font-family:var(--f-display);font-size:18px;line-height:1}
.note.read .note-ico{background:var(--surface);color:var(--ok)}
.note-name{min-width:0}
.note-name b{display:block;font-family:var(--f-label);font-weight:700;font-size:18px;letter-spacing:.03em;text-transform:uppercase;line-height:1.15}
.note-name span{font-size:13px;color:var(--mute);font-family:var(--f-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chev{width:20px;height:20px;transition:transform .2s ease;color:var(--mute)}
.note-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.note-body{padding:0 var(--s-lg) var(--s-lg);display:flex;flex-direction:column;gap:var(--s-md)}
.gate{background:var(--red-soft);padding:var(--s-lg);display:flex;flex-direction:column;gap:var(--s-md);align-items:flex-start}
.gate-t{display:flex;align-items:center;gap:var(--s-sm);font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--red-text)}
.gate p{color:var(--ink-2);font-size:15px}
.note-text{display:flex;flex-direction:column;gap:var(--s-md);max-width:62ch}
.note-text p{color:var(--ink-2)}
.keep{border-top:1px solid var(--line);padding-top:var(--s-md)}
.keep ul{margin:var(--s-sm) 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s-sm)}
.keep li{position:relative;padding-left:20px;font-size:15px}
.keep li::before{content:"";position:absolute;left:0;top:.6em;width:10px;height:3px;background:var(--red)}
.note-actions{display:flex;flex-wrap:wrap;gap:var(--s-sm);align-items:center}
.done-txt{font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);font-size:14px}

.empty{background:var(--surface);padding:var(--s-lg);color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

/* up next mini list */
.after{display:flex;flex-direction:column}
.after-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:var(--s-md);padding-block:var(--s-md);border-top:1px solid var(--line)}
.after-row:last-child{border-bottom:1px solid var(--line)}
.after-n{font-family:var(--f-display);font-size:22px;color:var(--mute);font-variant-numeric:tabular-nums}
.after-row b{font-family:var(--f-label);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;display:block;line-height:1.15}
.after-row span{font-size:13px;color:var(--mute)}
.mini{font-family:var(--f-label);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.mini.red{color:var(--red-text)}

/* filters */
.chips{display:flex;gap:var(--s-sm);overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:var(--r-pill);padding:8px 16px;font-weight:600;font-size:15px;white-space:nowrap;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:17px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;display:grid;grid-template-columns:36px 1fr;gap:var(--s-md);padding-block:var(--s-sm)}
.tl-node{position:relative;z-index:1;display:grid;place-items:center;width:36px;height:36px}
.tl-item.watch .tl-node{background:var(--bg)}
.tl-item.note-i .tl-node::before{content:"";width:12px;height:12px;background:var(--bg);border:2px solid var(--red);border-radius:50%}
.tl-item.note-i.read .tl-node::before{background:var(--red)}
.cbx{appearance:none;-webkit-appearance:none;margin:0;width:32px;height:32px;border:2px solid var(--ink);border-radius:50%;background:var(--bg);cursor:pointer;display:grid;place-items:center;transition:background .15s ease,border-color .15s ease}
.cbx::after{content:"";width:12px;height:7px;border:3px solid var(--on-red);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.cbx:checked{background:var(--red);border-color:var(--red)}
.cbx:checked::after{opacity:1}
.tl-main{min-width:0}
.tl-watch{display:flex;flex-direction:column;gap:2px;padding:6px 0 var(--s-sm);cursor:pointer}
.tl-watch .t{font-family:var(--f-display);font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.tl-watch .s{font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tl-watch .m{display:flex;gap:var(--s-sm);align-items:center;flex-wrap:wrap;margin-top:4px}
.tl-watch .l{font-size:14px;color:var(--mute);margin-top:4px;max-width:52ch}
.tl-item.watch.seen .t{color:var(--mute)}
.tl-item.watch.current .t{color:var(--red-text)}
.now-pill{background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:2px 10px;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tl-item.note-i .note{margin-top:2px}
.tl-item.note-i .note-head{min-height:52px;padding-block:var(--s-sm)}
.tl-item.note-i .note-ico{width:30px;height:30px;font-size:15px}
.tl-item.note-i .note-name b{font-size:16px}

/* notes page groups */
.group{display:flex;flex-direction:column;gap:var(--s-md)}
.group-h{display:flex;align-items:center;gap:var(--s-sm);flex-wrap:wrap}
.group-h b{font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.group-h .eyebrow{font-size:12px}
.reset{display:flex;flex-direction:column;gap:var(--s-sm);align-items:flex-start;border-top:1px solid var(--line);padding-top:var(--s-xl)}
.reset p{color:var(--mute);font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-xs);padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:none;border:0;cursor:pointer;color:var(--mute);min-height:52px;text-decoration:none}
.tab svg{width:22px;height:22px}
.tab span{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--red-text)}
.tab-badge{font-variant-numeric:tabular-nums}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

function watchNo(item){ return WATCH.indexOf(item)+1; }

const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const WARN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3 2 20h20Z"/><path d="M12 10v4M12 17v.5"/></svg>';

function noteCard(n, ctx){
  const isOpen = expanded.has(ctx+n.id);
  const read = !!S.read[n.id];
  const rev = !!S.open[n.id];
  const bid = "nb-"+ctx+n.id;
  let body = "";
  if(isOpen){
    if(!rev){
      body = `<div class="gate">
        <div class="gate-t">${WARN}<span>Spoilers</span></div>
        <p>Esta nota conta a história de <b>${esc(name(n))}</b>, incluindo o final. Lê só se não fores ver.</p>
        <button class="btn btn-red btn-sm" data-act="reveal" data-id="${n.id}">Mostrar spoilers</button>
      </div>`;
    } else {
      body = `<div class="note-text">${n.n.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
        <div class="keep"><div class="eyebrow red">Para levar para a frente</div><ul>${n.keep.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>
        <div class="note-actions">${read
          ? `<span class="done-txt">Lida</span><button class="btn btn-soft btn-sm" data-act="unread" data-id="${n.id}">Marcar como não lida</button>`
          : `<button class="btn btn-red btn-sm" data-act="read" data-id="${n.id}">Marcar como lida</button>`}</div>`;
    }
  }
  return `<article class="note${read?" read":""}">
    <button class="note-head" aria-expanded="${isOpen}" aria-controls="${bid}" data-act="toggle" data-key="${ctx+n.id}">
      <span class="note-ico" aria-hidden="true">${read?"✓":"!"}</span>
      <span class="note-name"><b>${esc(name(n))}</b><span>${esc(n.k)} · ${esc(n.y)} · ${read?"Lida":"Nota com spoilers"}</span></span>
      ${CHEV}
    </button>
    <div class="note-body" id="${bid}" ${isOpen?"":"hidden"}>${body}</div>
  </article>`;
}

function segs(){
  const nx = nextWatch();
  return `<div class="segs" aria-hidden="true">${WATCH.map(i=>`<i class="${S.seen[i.id]?"on":(i===nx?"now":"")}"></i>`).join("")}</div>`;
}
function timeLeft(){
  const ms = Math.max(0, DOOMSDAY - new Date());
  return {ms, d:Math.floor(ms/86400000), h:Math.floor(ms%86400000/3600000), m:Math.floor(ms%3600000/60000)};
}
function doomHTML(){
  const L = timeLeft();
  const dateTxt = new Intl.DateTimeFormat("pt-PT",{day:"numeric",month:"long"}).format(DOOMSDAY);
  const u = 'style="font-family:var(--f-label);font-size:14px;color:var(--mute);letter-spacing:.06em"';
  const big = L.ms===0 ? "Hoje" : (L.d>0 ? `${fmtN.format(L.d)}<span ${u}> D </span>${L.h}<span ${u}> H</span>` : `${L.h}<span ${u}> H </span>${L.m}<span ${u}> MIN</span>`);
  return `<div class="doom-txt"><b>Avengers: Doomsday</b><span>Sessão a ${dateTxt}, às 20h10</span></div><div class="doom-days">${big}</div>`;
}

function renderHome(){
  const nx = nextWatch();
  const seenN = WATCH.filter(i=>S.seen[i.id]).length;
  const readN = NOTES.filter(i=>S.read[i.id]).length;
  let html = `<h1 class="sr" id="h-inicio">Próximo projeto</h1>
  <div>${segs()}<div class="prog-meta"><span>${seenN} de ${WATCH.length} vistos</span><span>${readN} de ${NOTES.length} notas lidas</span></div></div>`;

  if(!nx){
    html += `<div class="hero"><div class="hero-top"><div class="hero-num">23<small>de 23</small></div><span class="tag">Missão cumprida</span></div>
      <div><h2 class="hero-title">Prontos para Doomsday</h2></div>
      <p class="hero-log">Viram tudo o que era preciso. Agora é esperar pela estreia.</p></div>`;
  } else {
    const before = notesBefore(nx);
    const pending = before.filter(n=>!S.read[n.id]);
    before.forEach(n=>{ if(!expanded.has("h"+n.id) && !S.read[n.id] && !expanded.has("hx"+n.id)) expanded.add("h"+n.id); });
    html += `<div class="hero">
      <div class="hero-top"><div class="hero-num">${String(watchNo(nx)).padStart(2,"0")}<small>de ${WATCH.length} · ${esc(nx.y)}</small></div><span class="tag">${esc(nx.k)}</span></div>
      <div><div class="eyebrow" style="color:var(--tile-mute)">A seguir</div><h2 class="hero-title">${esc(nx.t)}</h2>${nx.s?`<div class="hero-sub">${esc(nx.s)}</div>`:""}</div>
      <div class="hero-actions">
        <button class="btn btn-red" data-act="seen" data-id="${nx.id}">Marcar como visto</button>
        ${pending.length?`<a class="btn btn-ghost-tile" href="#antes">Ler ${pending.length} ${pending.length===1?"nota":"notas"} antes</a>`:""}
      </div>
    </div>`;

    html += `<section class="group" id="antes" aria-labelledby="h-antes">
      <div class="sec-head"><h2 class="sec-title" id="h-antes">Antes de ver</h2><span class="eyebrow">${before.length?`${before.length} ${before.length===1?"nota":"notas"}`:""}</span></div>`;
    if(before.length){
      html += `<p style="color:var(--ink-2)">Estes projetos ficaram de fora da lista. A nota conta o essencial para não se perderem em ${esc(name(nx))}.</p>
        <div class="notes">${before.map(n=>noteCard(n,"h")).join("")}</div>`;
    } else {
      html += `<div class="empty"><b>Nada para ler</b>Não há projetos saltados entre o último que viram e este. Podem avançar.</div>`;
    }
    html += `</section>`;

    const later = WATCH.slice(watchNo(nx), watchNo(nx)+3);
    if(later.length){
      html += `<section class="group" aria-labelledby="h-depois"><div class="sec-head"><h2 class="sec-title" id="h-depois">Depois deste</h2><a class="eyebrow red" href="#timeline">Ver timeline</a></div>
      <div class="after">${later.map(i=>{ const nb = notesBefore(i).length; return `<div class="after-row"><span class="after-n">${String(watchNo(i)).padStart(2,"0")}</span><div style="min-width:0"><b>${esc(name(i))}</b><span>${esc(i.k)} · ${esc(i.y)}</span></div>${nb?`<span class="mini red">+${nb} ${nb===1?"nota":"notas"}</span>`:""}</div>`; }).join("")}</div></section>`;
    }
  }

  html += `<div class="doom" id="doom">${doomHTML()}</div>`;
  document.getElementById("view-inicio").innerHTML = html;
}

function renderTimeline(){
  const nx = nextWatch();
  const chips = [["tudo","Tudo · "+ITEMS.length],["ver","Para ver · "+WATCH.length],["notas","Notas · "+NOTES.length]];
  let html = `<div class="sec-head"><h1 class="sec-title" id="h-timeline">Timeline</h1><span class="eyebrow">${ITEMS.length} projetos</span></div>
  <div class="chips" role="group" aria-label="Filtrar timeline">${chips.map(([k,l])=>`<button class="chip" aria-pressed="${filter===k}" data-act="filter" data-f="${k}">${l}</button>`).join("")}</div>
  <ol class="tl" style="list-style:none;margin:0;padding:0">`;
  ITEMS.forEach(i=>{
    if(filter==="ver" && !i.w) return;
    if(filter==="notas" && i.w) return;
    if(i.w){
      const seen = !!S.seen[i.id]; const cur = i===nx;
      html += `<li class="tl-item watch${seen?" seen":""}${cur?" current":""}">
        <div class="tl-node"><input type="checkbox" class="cbx" id="cb-${i.id}" data-act="check" data-id="${i.id}" ${seen?"checked":""}></div>
        <label class="tl-main tl-watch" for="cb-${i.id}">
          <span class="t">${esc(i.t)}</span>${i.s?`<span class="s">${esc(i.s)}</span>`:""}
          <span class="m"><span class="mini">${String(watchNo(i)).padStart(2,"0")} · ${esc(i.k)} · ${esc(i.y)}</span>${cur?'<span class="now-pill">A seguir</span>':""}</span>
        </label></li>`;
    } else {
      html += `<li class="tl-item note-i${S.read[i.id]?" read":""}"><div class="tl-node" aria-hidden="true"></div><div class="tl-main">${noteCard(i,"t")}</div></li>`;
    }
  });
  html += `</ol>`;
  document.getElementById("view-timeline").innerHTML = html;
}

function renderNotes(){
  const readN = NOTES.filter(i=>S.read[i.id]).length;
  let html = `<div class="sec-head"><h1 class="sec-title" id="h-notas">Notas</h1><span class="eyebrow">${readN} de ${NOTES.length} lidas</span></div>
  <p style="color:var(--ink-2)">Os ${NOTES.length} projetos que ficaram de fora, agrupados pelo filme ou série antes do qual devem ser lidos. Cada nota tem spoilers e pede confirmação para abrir.</p>`;
  const groups = [];
  NOTES.forEach(n=>{ const p = parentWatch(n); let g = groups.find(x=>x.p===p); if(!g){ g={p,list:[]}; groups.push(g);} g.list.push(n); });
  groups.forEach(g=>{
    const allRead = g.list.every(n=>S.read[n.id]);
    html += `<section class="group"><div class="group-h"><span class="eyebrow ${allRead?"":"red"}">Antes de</span><b>${g.p?esc(name(g.p)):"Doomsday"}</b>${g.p&&S.seen[g.p.id]?'<span class="mini">· já visto</span>':""}</div>
      <div class="notes">${g.list.map(n=>noteCard(n,"n")).join("")}</div></section>`;
  });
  html += `<div class="reset"><p>Apaga os vistos, as notas lidas e os spoilers revelados neste dispositivo.</p>
    ${resetArmed
      ? `<div class="note-actions"><button class="btn btn-red btn-sm" data-act="reset-yes">Sim, apagar progresso</button><button class="btn btn-soft btn-sm" data-act="reset-no">Cancelar</button></div>`
      : `<button class="btn btn-soft btn-sm" data-act="reset">Recomeçar do zero</button>`}</div>`;
  document.getElementById("view-notas").innerHTML = html;
}

function renderHeader(){
  const seenN = WATCH.filter(i=>S.seen[i.id]).length;
  const unread = NOTES.filter(i=>!S.read[i.id]).length;
  document.getElementById("hdrCount").innerHTML = `<b>${seenN}</b>/${WATCH.length} vistos`;
  document.getElementById("tabBadge").textContent = unread ? "· "+unread : "";
}

function current(){ const h = location.hash.replace("#",""); return ["inicio","timeline","notas"].includes(h)?h:(h==="antes"?"inicio":"inicio"); }
function render(){
  renderHeader(); renderHome(); renderTimeline(); renderNotes();
  const c = current();
  ["inicio","timeline","notas"].forEach(v=>{ document.getElementById("view-"+v).hidden = v!==c; });
  document.querySelectorAll(".tab").forEach(t=>{ if(t.dataset.tab===c) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); });
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(a==="check") return;
  if(a==="toggle"){ const k = el.dataset.key; if(expanded.has(k)){ expanded.delete(k); if(k[0]==="h") expanded.add("hx"+k.slice(1)); } else expanded.add(k); }
  else if(a==="reveal"){ S.open[id]=1; save(); }
  else if(a==="read"){ S.read[id]=1; S.open[id]=1; save(); }
  else if(a==="unread"){ delete S.read[id]; save(); }
  else if(a==="seen"){ S.seen[id]=1; save(); window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
  else if(a==="filter"){ filter = el.dataset.f; }
  else if(a==="reset"){ resetArmed = true; }
  else if(a==="reset-no"){ resetArmed = false; }
  else if(a==="reset-yes"){ S={seen:{},open:{},read:{}}; save(); resetArmed=false; expanded.clear(); }
  else return;
  const keep = el.dataset.key || (id ? id : null);
  render();
  if(keep){ const again = document.querySelector(`[data-key="${CSS.escape(el.dataset.key||"")}"]`); if(again && a==="toggle") again.focus({preventScroll:true}); }
});
document.addEventListener("change", e=>{
  const el = e.target; if(el.dataset.act!=="check") return;
  if(el.checked) S.seen[el.dataset.id]=1; else delete S.seen[el.dataset.id];
  save(); render();
  const again = document.getElementById(el.id); if(again) again.focus({preventScroll:true});
});
window.addEventListener("hashchange", ()=>{
  const h = location.hash;
  render();
  if(h==="#antes"){ const t=document.getElementById("antes"); if(t) t.scrollIntoView(); }
  else window.scrollTo(0,0);
});
render();
setInterval(()=>{ const d=document.getElementById("doom"); if(d) d.innerHTML=doomHTML(); },30000);
</script>

</body></html>
